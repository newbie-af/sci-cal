
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172337">
  <meta name="description" content="A modern scientific calculator with keyboard support.">
  <title>Scientific Calculator</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="app-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <rect x="5" y="3" width="38" height="42" rx="10"
                fill="#8b5cf6"/>
          <rect x="11" y="9" width="26" height="10" rx="3"
                fill="#172337"/>
          <g fill="#ffffff">
            <circle cx="15" cy="26" r="2.5"/>
            <circle cx="24" cy="26" r="2.5"/>
            <circle cx="33" cy="26" r="2.5"/>
            <circle cx="15" cy="35" r="2.5"/>
            <circle cx="24" cy="35" r="2.5"/>
            <circle cx="33" cy="35" r="2.5"/>
          </g>
        </svg>
      </div>
      <div>
        <h1>Scientific Calculator</h1>
        <p>Precision in every calculation</p>
      </div>
    </header>

    <section class="calculator" aria-label="Calculator">
      <div class="display">
        <label for="expression" class="sr-only">Expression</label>
        <input
          id="expression"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Enter an expression"
          aria-label="Editable mathematical expression"
        >
        <div id="result" class="result" aria-live="polite">0</div>
        <div id="status" class="status" aria-live="polite">
          DEG · Ready
        </div>
      </div>

      <div class="keypad" id="keypad">
        <button class="key clear" data-action="clear">C</button>
        <button class="key utility" data-action="backspace"
                aria-label="Backspace">⌫</button>
        <button class="key utility" data-insert="(">(</button>
        <button class="key utility" data-insert=")">)</button>
        <button class="key function" data-function="sqrt"
                aria-label="Square root">√</button>

        <button class="key function" data-function="sin">sin</button>
        <button class="key function" data-function="cos">cos</button>
        <button class="key function" data-function="tan">tan</button>
        <button class="key function" data-function="log">log</button>
        <button class="key function" data-function="ln">ln</button>

        <button class="key number" data-insert="7">7</button>
        <button class="key number" data-insert="8">8</button>
        <button class="key number" data-insert="9">9</button>
        <button class="key operator" data-insert="/">÷</button>
        <button class="key operator" data-insert="^">xʸ</button>

        <button class="key number" data-insert="4">4</button>
        <button class="key number" data-insert="5">5</button>
        <button class="key number" data-insert="6">6</button>
        <button class="key operator" data-insert="*">×</button>
        <button class="key constant" data-insert="pi">π</button>

        <button class="key number" data-insert="1">1</button>
        <button class="key number" data-insert="2">2</button>
        <button class="key number" data-insert="3">3</button>
        <button class="key operator" data-insert="-">−</button>
        <button class="key constant" data-insert="e">e</button>

        <button class="key number zero" data-insert="0">0</button>
        <button class="key number" data-insert=".">.</button>
        <button class="key utility" data-action="sign">±</button>
        <button class="key operator" data-insert="+">+</button>
        <button class="key equals" data-action="calculate">=</button>
      </div>

      <footer class="calculator-footer">
        <span>Scientific mode</span>
        <span>Trigonometry: degrees</span>
      </footer>
    </section>

    <p class="keyboard-help">
      <kbd>Enter</kbd> Calculate
      <kbd>Esc</kbd> Clear
      <kbd>Backspace</kbd> Delete
    </p>
  </main>
</body>
</html>
